<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proyectos | Servicio Social</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/portada.css" />
    <link rel="stylesheet" href="/css/menu.css" />
    <link rel="stylesheet" href="/css/topbar.css" />
    <link rel="stylesheet" href="/css/actividad.css" />
  </head>

  <body>
    <div id="menu-container"></div>

    <div class="main">
      <div id="topbar-container"></div>

      <div class="content">
        <div class="container">
          <div class="encabezado-vista">
            <div>
              <h1 class="titulo-pagina">Gestión de Proyectos</h1>
              <p class="subtitulo-pagina">
                Consulta, administra y da seguimiento a los proyectos
                registrados.
              </p>
            </div>

            <button
              id="btnNuevaActividad"
              class="btn btn-primary shadow-sm btn-nuevo-proyecto"
              onclick="abrirNuevo()"
            >
              + Nuevo Proyecto
            </button>
          </div>

          <div id="resumenProyectos" class="resumen-grid"></div>

          <div class="filtros-panel">
            <div id="contenedorFiltros" class="filtros-grid"></div>

            <div class="buscador mt-3" id="contenedorBusquedaResponsable">
              <div class="row g-2">
                <div class="col-md-7">
                  <input
                    type="text"
                    id="buscarResponsable"
                    class="form-control"
                    placeholder="Buscar por responsable..."
                  />
                </div>

                <div class="col-md-5" id="contenedorFiltroHorasAlumno">
                  <select id="filtroHoras" class="form-select">
                    <option value="Todos">Todas las horas</option>
                    <option value="1-100">1 a 100 hrs</option>
                    <option value="101-200">101 a 200 hrs</option>
                    <option value="201-300">201 a 300 hrs</option>
                    <option value="301-480">301 a 480 hrs</option>
                  </select>
                </div>
              </div>
            </div>
          </div>

          <div
            id="sinActividades"
            class="alert alert-info text-center"
            style="display: none"
          >
            No hay proyectos registrados por el momento.
          </div>

          <div id="listaActividades"></div>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="modalActividad"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <form id="formActividad" class="modal-content border-0 shadow">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title" id="tituloModalActividad">
              Detalles del Proyecto
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <input type="hidden" id="actividadId" />

            <div class="mb-3">
              <label class="form-label fw-bold">Nombre del Proyecto</label>
              <input
                type="text"
                class="form-control"
                id="nombreActividad"
                placeholder="Ej: Apoyo en Sistemas"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Descripción</label>
              <textarea
                class="form-control"
                id="descripcion"
                rows="3"
                placeholder="Describe brevemente las tareas..."
                required
              ></textarea>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Horas que libera</label>
                <input
                  type="number"
                  class="form-control"
                  id="horas"
                  placeholder="0"
                  required
                />
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Cupo (Alumnos)</label>
                <input
                  type="number"
                  class="form-control"
                  id="totalAlumnos"
                  placeholder="0"
                  required
                />
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Fecha de Inicio</label>
                <input
                  type="date"
                  class="form-control"
                  id="fechaInicio"
                  required
                />
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label fw-bold">Fecha de Término</label>
                <input
                  type="date"
                  class="form-control"
                  id="fechaFin"
                  required
                />
              </div>
            </div>

            <div class="mb-3" id="contenedorEstatus">
              <label class="form-label fw-bold text-primary">
                Estado del Proyecto
              </label>

              <select id="editEstatus" class="form-select border-primary">
                <option value="Pendiente">Pendiente (Borrador)</option>
                <option value="Activa">Activa (Pública)</option>
                <option value="Finalizada">Finalizada (Concluida)</option>
                <option value="Cancelada">Cancelada</option>
              </select>
            </div>
          </div>

          <div class="modal-footer bg-light">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>

            <button
              type="submit"
              class="btn btn-primary px-4"
              id="textoBtnGuardarProyecto"
            >
              Guardar Proyecto
            </button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal fade" id="modalTareas" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <div>
              <h5 class="modal-title mb-0" id="nombreActividadModal"></h5>
              <small id="infoHoras" class="fw-bold"></small>
            </div>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <div class="d-flex justify-content-between mb-3 flex-wrap gap-2">
              <h6 class="mb-0">Tareas registradas</h6>

              <button
                id="btnNuevaTarea"
                class="btn btn-success btn-sm"
                onclick="abrirNuevaTarea()"
              >
                + Nueva tarea
              </button>
            </div>

            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th>Tarea</th>
                    <th>Horas</th>
                    <th>Inicio</th>
                    <th>Fin</th>
                    <th class="text-center">Acciones</th>
                  </tr>
                </thead>
                <tbody id="tablaTareas"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="modalFormTarea"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-md">
        <form id="formTarea" class="modal-content">
          <div class="modal-header">
            <h6 class="modal-title">Detalle de Tarea</h6>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <input type="hidden" id="tareaId" />

            <div class="mb-2">
              <label class="small fw-bold">Nombre</label>
              <input
                type="text"
                class="form-control form-control-sm"
                id="nombreTarea"
                required
              />
            </div>

            <div class="mb-2">
              <label class="small fw-bold">Horas</label>
              <input
                type="number"
                class="form-control form-control-sm"
                id="horasTarea"
                required
              />
            </div>

            <div class="row">
              <div class="col-md-6 mb-2">
                <label class="small fw-bold">Fecha de inicio</label>
                <input
                  type="date"
                  class="form-control form-control-sm"
                  id="fechaInicioTarea"
                  required
                />
              </div>

              <div class="col-md-6 mb-2">
                <label class="small fw-bold">Fecha de fin</label>
                <input
                  type="date"
                  class="form-control form-control-sm"
                  id="fechaFinTarea"
                  required
                />
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button type="submit" class="btn btn-primary btn-sm w-100">
              Guardar Tarea
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/actividad.js"></script>
    <script src="/js/layout.js"></script>
  </body>
</html>
