<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Grupos | UTM</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <link rel="stylesheet" href="/css/portada.css" />
    <link rel="stylesheet" href="/css/menu.css" />
    <link rel="stylesheet" href="/css/topbar.css" />
    <link rel="stylesheet" href="/css/grupos.css" />
  </head>

  <body>
    <div id="menu-container"></div>

    <div class="main">
      <div id="topbar-container"></div>

      <div class="content" id="contenido">
        <div class="welcome-card">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
              <h1>📚 Gestión de Grupos</h1>
              <p>
                Administración de grupos académicos y asignación de tutores.
              </p>
            </div>
          </div>

          <hr />

          <div class="mb-3" id="contenedorFiltroGrupo">
            <label for="buscarGrupo" class="form-label fw-bold">
              Buscar grupo
            </label>
            <input
              type="text"
              id="buscarGrupo"
              class="form-control"
              placeholder="Ej: 5B, 4A, 3C..."
            />
          </div>

          <div id="listaGrupos" class="table-responsive"></div>

          <div
            id="sinGrupos"
            class="alert alert-info text-center mt-3"
            style="display: none"
          >
            <i class="fas fa-info-circle me-2"></i>
            No hay grupos registrados por el momento.
          </div>
        </div>
      </div>
    </div>

    <script src="/js/layout.js"></script>
    <script src="/js/grupos.js"></script>
  </body>
</html>
