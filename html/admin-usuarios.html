<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Administración | Servicio Social</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/portada.css" />
    <link rel="stylesheet" href="/css/menu.css" />
    <link rel="stylesheet" href="/css/topbar.css" />
    <link rel="stylesheet" href="/css/admin-usuario.css" />
  </head>
  <body>
    <div id="menu-container"></div>

    <div class="main">
      <div id="topbar-container"></div>

      <div class="content">
        <div class="container mt-4">
          <div class="admin-header">
            <div>
              <h1 class="admin-title">Panel de Administración</h1>
              <p class="admin-subtitle">
                Consulta, busca y da de alta alumnos, tutores, responsables y
                subdirector.
              </p>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6 col-xl-3">
              <button
                type="button"
                id="cardAlumno"
                class="admin-card admin-card-alumno active"
                onclick="seleccionarTipoRegistro('alumno')"
              >
                <span class="admin-card-label">Gestión de</span>
                <strong>Alumnos</strong>
                <small>Consulta y alta de alumnos</small>
              </button>
            </div>

            <div class="col-md-6 col-xl-3">
              <button
                type="button"
                id="cardTutor"
                class="admin-card admin-card-tutor"
                onclick="seleccionarTipoRegistro('tutor')"
              >
                <span class="admin-card-label">Gestión de</span>
                <strong>Tutores</strong>
                <small>Consulta y alta de tutores</small>
              </button>
            </div>

            <div class="col-md-6 col-xl-3">
              <button
                type="button"
                id="cardResponsable"
                class="admin-card admin-card-responsable"
                onclick="seleccionarTipoRegistro('responsable')"
              >
                <span class="admin-card-label">Gestión de</span>
                <strong>Responsables</strong>
                <small>Consulta y alta de responsables</small>
              </button>
            </div>

            <div class="col-md-6 col-xl-3">
              <button
                type="button"
                id="cardSubdirector"
                class="admin-card admin-card-subdirector"
                onclick="seleccionarTipoRegistro('subdirector')"
              >
                <span class="admin-card-label">Gestión de</span>
                <strong>Subdirector</strong>
                <small>Consulta y alta de subdirector</small>
              </button>
            </div>
          </div>

          <div class="card shadow-sm border-0 mb-4">
            <div class="card-body">
              <div class="row g-3 align-items-end">
                <div class="col-md-8">
                  <label class="form-label fw-bold" id="labelBusquedaAdmin">
                    Buscar registro
                  </label>
                  <input
                    type="text"
                    id="buscarRegistroAdmin"
                    class="form-control"
                    placeholder="Buscar por nombre, correo, matrícula o grupo..."
                  />
                </div>

                <div class="col-md-2">
                  <button
                    type="button"
                    id="btnLimpiarBusquedaAdmin"
                    class="btn btn-outline-secondary w-100"
                  >
                    Limpiar
                  </button>
                </div>

                <div class="col-md-2">
                  <button
                    type="button"
                    id="btnNuevoRegistro"
                    class="btn btn-primary w-100"
                  >
                    + Nuevo
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div
            class="card shadow-sm border-0 mb-4"
            id="cardFormularioAdmin"
            style="display: none"
          >
            <div
              class="card-header bg-white py-3 d-flex justify-content-between align-items-center"
            >
              <h5 class="mb-0" id="tituloFormulario">Nuevo registro</h5>
              <button
                type="button"
                class="btn btn-outline-secondary btn-sm"
                id="btnCerrarFormulario"
              >
                Cerrar
              </button>
            </div>

            <div class="card-body">
              <div id="alertaAdmin" class="alert d-none" role="alert"></div>
              <div id="formularioAdminContainer"></div>
            </div>
          </div>

          <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
              <h5 class="mb-0" id="tituloListado">Alumnos registrados</h5>
            </div>

            <div class="card-body">
              <div class="table-responsive">
                <table
                  class="table table-hover align-middle tabla-admin-usuarios"
                >
                  <thead class="table-light" id="theadAdminUsuarios"></thead>
                  <tbody id="listaAdminUsuarios">
                    <tr>
                      <td colspan="6" class="text-center text-muted py-4">
                        Cargando registros...
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="/js/layout.js"></script>
    <script src="/js/admin-usuarios.js"></script>
  </body>
</html>
